<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Naval Draft</title>
<style>
:root{
  --bg:#0b1b2e; --bg2:#12304d; --panel:#16385a; --ink:#eaf4ff; --mute:#8fb0cf;
  --gold:#ffc83d; --good:#3ddc84; --bad:#ff5a5f; --acc:#35a7ff;
  --melee:#e0554f; --archer:#4cc46a; --bomber:#f0903a; --artillery:#a56bff; --elite:#ffd34d; --boss:#ff4d8d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#050d17;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;background:linear-gradient(#0e2845,#0b1b2e);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
h1{margin:6px 0 0;font-size:28px;letter-spacing:1px;text-align:center}
.sub{text-align:center;color:var(--mute);font-size:13px;margin:2px 0 8px}
button{font:inherit;color:var(--ink);border:0;border-radius:14px;padding:12px 16px;background:var(--panel);font-weight:700;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:linear-gradient(#37b3ff,#1f7fd6);box-shadow:0 4px 0 #14568f}
.good{background:linear-gradient(#45e08c,#22a85f);box-shadow:0 4px 0 #17703f}
.bad{background:linear-gradient(#ff7a7e,#d9373d);box-shadow:0 4px 0 #8f2226}

/* deck screen */
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.gold{color:var(--gold);font-weight:800}
.deckbar{display:flex;gap:6px;flex-wrap:wrap;background:#0a1626;border-radius:12px;padding:8px;min-height:62px}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:48px;border-radius:10px;background:var(--panel);font-size:20px;line-height:1;position:relative;border:2px solid transparent}
.chip small{font-size:10px;color:var(--gold);margin-top:2px}
.chip .hpb{position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:#0006;border-radius:2px}
.chip .hpb i{display:block;height:100%;background:var(--good);border-radius:2px}
.chip.new{border-color:var(--acc)}
.stats{font-size:12px;color:var(--mute);margin:6px 2px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;padding:2px 0 8px}
.ucard{background:var(--panel);border-radius:14px;padding:8px 10px;border-left:5px solid var(--c,#888);position:relative}
.ucard.locked{opacity:.85;background:#10263f}
.ucard .t{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
.ucard .st{font-size:11px;color:var(--mute);margin:3px 0 6px}
.ucard .stars{color:var(--gold);font-size:12px}
.ucard .ctl{display:flex;align-items:center;justify-content:space-between}
.ucard .ctl button{padding:4px 12px;font-size:16px;border-radius:10px}
.ucard .n{font-weight:800}
.buy{width:100%;font-size:12px!important;padding:6px!important;background:#6a4a00!important;color:var(--gold)}
.footer{padding-top:8px}
.footer button{width:100%;font-size:18px;padding:14px}

/* draft */
.topbar{display:flex;justify-content:space-between;align-items:center}
.wave{font-weight:900;letter-spacing:1px}
.budget{font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #0007}
.pips{display:flex;gap:3px;margin:4px 0 8px}
.pips i{flex:1;height:10px;border-radius:3px;background:#1d3c5c}
.pips i.on{background:var(--gold)}
.pips i.hold{background:#ffc83d55}
.armyrow{display:flex;gap:5px;overflow-x:auto;min-height:56px;padding:6px;background:#0a1626;border-radius:12px;align-items:center}
.armyrow .empty{color:var(--mute);font-size:12px}
.cardarea{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.card{width:min(300px,78vw);border-radius:22px;padding:14px 16px 16px;background:linear-gradient(#1e4d7b,#14385a);border:3px solid var(--c);box-shadow:0 12px 30px #0009;touch-action:none;position:relative;cursor:grab}
.card.enter{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .role{font-size:12px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:1px}
.card .cost{font-size:22px;font-weight:900;color:var(--gold)}
.card .icon{text-align:center}
.card .nm{text-align:center;font-size:21px;font-weight:900}
.card .ds{text-align:center;color:var(--mute);font-size:12px;margin:2px 0 10px}
.card .sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card .sg div{background:#0a1626aa;border-radius:10px;padding:6px 8px;font-size:12px;color:var(--mute)}
.card .sg b{display:block;color:var(--ink);font-size:16px}
.card .after{margin-top:10px;text-align:center;font-size:13px;color:var(--mute)}
.card .after b{color:var(--gold)}
.stamp{position:absolute;top:18px;font-size:22px;font-weight:900;border:4px solid;border-radius:10px;padding:2px 10px;opacity:0;transform:rotate(-12deg);pointer-events:none}
.stamp.r{left:14px;color:var(--good)}
.stamp.l{right:14px;color:var(--bad);transform:rotate(12deg)}
.pool{margin-top:6px}
.pool .lbl{font-size:11px;color:var(--mute);margin-bottom:3px}
.pool .chips{display:flex;gap:4px;flex-wrap:wrap;min-height:40px}
.pool .chip{width:34px;height:38px;font-size:16px}
.pool .chip.dead{opacity:.25}
.btns{display:flex;gap:8px;padding-top:8px}
.btns button{flex:1}
.btns #btnStart{flex:.8;font-size:13px}
.done{text-align:center}
.done h2{margin:0 0 6px}
.done p{color:var(--mute);margin:0 0 14px}
.toast{position:absolute;left:50%;top:44%;transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}

/* battle */
.bwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:10/16;border-radius:14px;touch-action:none}
.bhud{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.bhud button{padding:6px 12px;font-size:14px}
.bar{height:8px;border-radius:4px;background:#0006;overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:100%;transition:width .2s}
.bar.p i{background:var(--acc)} .bar.e i{background:var(--bad)}
.hp{flex:1;display:flex;align-items:center;gap:6px;font-size:12px}

/* overlay */
#overlay{position:absolute;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#overlay.on{display:flex}
.modal{background:linear-gradient(#1e4d7b,#14385a);border-radius:22px;padding:22px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px #000a}
.modal h2{margin:0 0 6px;font-size:26px}
.modal p{color:var(--mute);margin:4px 0}
.modal .chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.modal button{width:100%;margin-top:10px}

/* mini unit cards */
.mc{flex:0 0 auto;width:44px;height:60px;border-radius:9px;background:linear-gradient(#1f4f80,#14385a);border:2px solid var(--c,#888);position:relative;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1;box-shadow:0 2px 4px #0006}
.mc.opp{background:linear-gradient(#6a2538,#431726)}
.mc .s{position:absolute;top:1px;left:3px;font-size:9px;font-weight:900;color:var(--gold)}
.mc .hpb{position:absolute;left:4px;right:4px;bottom:3px;height:4px;background:#0008;border-radius:2px}
.mc .hpb i{display:block;height:100%;background:var(--good);border-radius:2px}
.mc.new{box-shadow:0 0 0 2px var(--acc),0 0 10px var(--acc)}
.pool .mc{width:34px;height:46px;font-size:17px}
.pool .mc.dead{opacity:.28}
.pool .mc .s{font-size:8px}
.armyrow .mc,.deckbar .mc{margin:0}
.armyrow{min-height:72px}
.deckbar{min-height:72px}

/* PvP */
.opp{display:flex;align-items:center;gap:8px;background:#2a1220;border:1px solid #6a2538;border-radius:12px;padding:6px 10px;margin-bottom:6px}
.opp .av{font-size:26px;width:38px;height:38px;border-radius:50%;background:#431726;display:flex;align-items:center;justify-content:center}
.opp .nm{font-weight:800;font-size:14px;line-height:1.1}
.opp .tr{font-size:11px;color:var(--mute)}
.opp .sc{margin-left:auto;font-weight:900;font-size:20px;letter-spacing:1px;text-align:right}
.opp .sc small{display:block;font-size:10px;color:var(--mute);letter-spacing:0;font-weight:700}
.oppcards{display:flex;gap:4px;overflow-x:auto;padding:2px 0}
.profile{display:flex;align-items:center;gap:8px;background:#0a1626;border-radius:12px;padding:8px 10px;margin-bottom:8px}
.profile input{flex:1;min-width:0;background:#12304d;border:1px solid #2a5a8a;color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-weight:800}
.trophy{color:var(--gold);font-weight:900}
.mm{align-items:center;justify-content:center;text-align:center;gap:10px}
.mm .spin{width:54px;height:54px;border-radius:50%;border:5px solid #1d3c5c;border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mm .av{font-size:64px}
.vs .side{margin:6px 0}
.vs .who{font-weight:800;font-size:13px;margin-bottom:4px;display:flex;justify-content:space-between}
.vs .cards{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:60px}
.vs .mid{font-size:26px;font-weight:900;color:var(--gold);letter-spacing:3px;margin:2px 0}
.vs .empty{color:var(--mute);font-size:12px;align-self:center}

.mc img{width:40px;height:40px;margin-top:7px;pointer-events:none}
.pool .mc img{width:30px;height:30px;margin-top:6px}
.card .icon{margin:4px 0 2px}
.card .icon img{width:132px;height:132px;border-radius:18px;box-shadow:0 4px 10px #0008;pointer-events:none}
.ucard img{width:28px;height:28px;vertical-align:middle;margin-right:2px}

.armyrow{flex-wrap:wrap;max-height:150px;overflow-y:auto}
.oppcards{max-height:72px}
/* dim everything behind the card so the card stays in front; round, stars and deck stay bright */
.cardarea{background:radial-gradient(ellipse at center,#02070dcc 0%,#02070de6 100%);border-radius:18px;margin:6px 0;box-shadow:inset 0 0 40px #000c}
.card{box-shadow:0 0 0 2px #fff2,0 0 36px var(--c),0 16px 36px #000c}
</style>
</head>
<body>
<div id="app">

  <!-- HOME: profile + deck builder -->
  <div id="home" class="screen">
    <h1>⚓ NAVAL DRAFT</h1>
    <div class="sub">PvP · every round you get more Stars. Build the strongest fleet.</div>
    <div class="profile">
      <span style="font-size:26px">🧑‍✈️</span>
      <input id="nameIn" maxlength="14" aria-label="Player name">
      <span class="trophy" id="trophyLbl"></span>
      <span class="gold" id="goldLbl"></span>
    </div>
    <div class="row between" style="margin-bottom:6px"><b>Destem <span id="deckCount"></span></b></div>
    <div class="deckbar" id="deckBar"></div>
    <div class="stats" id="deckStats"></div>
    <div class="grid" id="grid"></div>
    <div class="footer"><button class="primary" id="btnSail">⚔ FIND OPPONENT</button></div>
  </div>

  <!-- MATCHMAKING -->
  <div id="match" class="screen mm">
    <div id="mmBody"></div>
  </div>

  <!-- DRAFT -->
  <div id="draft" class="screen">
    <div class="opp" id="oppBar"></div>
    <div class="oppcards" id="oppCards"></div>
    <div class="topbar">
      <div class="wave" id="waveLbl">ROUND 1 / 5</div>
      <div class="budget" id="budgetLbl">★10</div>
    </div>
    <div class="pips" id="pips"></div>
    <div class="stats" style="margin:0 0 4px">YOUR FLEET (carried over + new recruits)</div>
    <div class="armyrow" id="armyRow"></div>
    <div class="cardarea" id="cardArea"></div>
    <div class="pool"><div class="lbl">STILL IN THIS ROUND'S POOL (order unknown) · DISCARDS ARE LIMITED</div><div class="chips" id="poolRow"></div></div>
    <div class="btns">
      <button class="bad" id="btnDiscard">✖ Discard</button>
      <button id="btnStart">⚔ Battle</button>
      <button class="good" id="btnRecruit">Recruit ✔</button>
    </div>
  </div>

  <!-- BATTLE -->
  <div id="battle" class="screen">
    <div class="bhud">
      <b id="bWave">ROUND 1</b>
      <div class="hp"><span>🟦</span><div class="bar p"><i id="hpP"></i></div></div>
      <div class="hp"><span>🟥</span><div class="bar e"><i id="hpE"></i></div></div>
      <button id="btnSpeed">x1</button>
    </div>
    <div class="bwrap"><canvas id="cv" width="360" height="576"></canvas></div>
  </div>

  <div id="overlay"><div class="modal" id="modal"></div></div>
</div>

<script>
// Naval Draft — game data + headless battle simulation (no DOM; usable from node for balance tests)
(function (root) {
  const W = 10, H = 16; // battlefield size in tiles (portrait)

  // cost = Star cost. Power grows faster than linearly with cost.
  const UNITS = {
    deckhand:  { id: 'deckhand',  name: 'Deckhand',      icon: '🗡️', role: 'Melee',     cost: 3, hp: 70,  dmg: 9,  range: 1.3, spd: 2.2, cd: 0.8, aoe: 0,   price: 0,   desc: 'Cheap, reliable frontliner.' },
    raider:    { id: 'raider',    name: 'Cutlass Raider',icon: '⚔️', role: 'Melee',     cost: 4, hp: 100, dmg: 14, range: 1.3, spd: 2.3, cd: 0.8, aoe: 0,   price: 0,   desc: 'Fast and hard-hitting.' },
    guard:     { id: 'guard',     name: 'Shield Guard',  icon: '🛡️', role: 'Melee',     cost: 5, hp: 210, dmg: 8,  range: 1.3, spd: 1.8, cd: 0.9, aoe: 0,   price: 0,   desc: 'Tanky wall. Soaks damage.' },
    captain:   { id: 'captain',   name: 'Elite Captain', icon: '🏴‍☠️', role: 'Elite',     cost: 6, hp: 270, dmg: 22, range: 1.4, spd: 2.2, cd: 0.8, aoe: 0,   price: 290, desc: 'Elite duelist. Stronger than two cheap units.' },
    archer:    { id: 'archer',    name: 'Archer',        icon: '🏹', role: 'Archer',    cost: 3, hp: 40,  dmg: 10, range: 5,   spd: 1.8, cd: 1.0, aoe: 0,   price: 0,   desc: 'Ranged single-target damage.' },
    longbow:   { id: 'longbow',   name: 'Longbow',       icon: '🎯', role: 'Archer',    cost: 4, hp: 55,  dmg: 18, range: 6.5, spd: 1.8, cd: 1.1, aoe: 0,   price: 0,   desc: 'Longer range, harder hits.' },
    sharp:     { id: 'sharp',     name: 'Sharpshooter',  icon: '🔫', role: 'Archer',    cost: 5, hp: 60,  dmg: 32, range: 7.5, spd: 1.8, cd: 1.4, aoe: 0,   price: 200, desc: 'Deadly sniper.' },
    bomber:    { id: 'bomber',    name: 'Bomber',        icon: '💣', role: 'Bomber',    cost: 4, hp: 60,  dmg: 15, range: 3,   spd: 1.8, cd: 1.3, aoe: 1.4, price: 0,   desc: 'Area damage vs groups.' },
    grenadier: { id: 'grenadier', name: 'Grenadier',     icon: '🧨', role: 'Bomber',    cost: 5, hp: 75,  dmg: 25, range: 3.5, spd: 1.8, cd: 1.4, aoe: 1.7, price: 200, desc: 'Bigger blast radius.' },
    elitebomb: { id: 'elitebomb', name: 'Elite Bomber',  icon: '☄️', role: 'Elite',     cost: 6, hp: 100, dmg: 29, range: 4.5, spd: 1.8, cd: 1.4, aoe: 2.1, price: 290, desc: 'Elite AoE devastation.' },
    cannon:    { id: 'cannon',    name: 'Cannon',        icon: '💥', role: 'Artillery', cost: 7, hp: 90, dmg: 46, range: 9,   spd: 1.2, cd: 2.2, aoe: 2.0, price: 390, desc: 'Long-range explosive shells.' },
    mortar:    { id: 'mortar',    name: 'Siege Mortar',  icon: '🌋', role: 'Artillery', cost: 8, hp: 115, dmg: 72, range: 12,  spd: 1.0, cd: 2.6, aoe: 2.5, price: 510, desc: 'Extreme range, enormous blast.' },
  };
  // Every unit has its own attack. spd = projectile speed in tiles/s (none = instant melee), arc = lob height in tiles.
  const SHOTS = {
    deckhand: { k: 'slash' }, raider: { k: 'slash2' }, guard: { k: 'bash' }, captain: { k: 'saber' },
    archer: { k: 'arrow', spd: 11, arc: 0.4 }, longbow: { k: 'longarrow', spd: 15, arc: 0.6 }, sharp: { k: 'bullet', spd: 34, arc: 0 },
    bomber: { k: 'bomb', spd: 6, arc: 1.3 }, grenadier: { k: 'grenade', spd: 7, arc: 1.1 }, elitebomb: { k: 'comet', spd: 9, arc: 1.8 },
    cannon: { k: 'ball', spd: 15, arc: 1.2 }, mortar: { k: 'shell', spd: 9, arc: 3.2 },
  };
  for (const id in SHOTS) UNITS[id].shot = SHOTS[id];
  const ORDER = Object.keys(UNITS);
  const STARTER = ['deckhand', 'raider', 'guard', 'archer', 'longbow', 'bomber'];
  const WAVES = 5;
  const BUDGETS = [10, 15, 20, 25, 30]; // star budget per round
  // bigger budgets need a bigger card pool: the deck is shuffled in this many times per round
  const poolCopies = b => Math.ceil(b / 12);
  // A round's card pool: random draws (with replacement) from the deck, so a card can show up several times or not at all.
  function drawPool(deck, budget, rng) {
    return Array.from({ length: deck.length * poolCopies(budget) }, () => deck[Math.floor(rnd(rng) * deck.length)]);
  }
  const MAX_DISCARDS = 3; // discards allowed per round
  const budgetFor = r => BUDGETS[Math.min(r, BUDGETS.length) - 1];
  const ROUNDS = 5, WIN_ROUNDS = 3;

  function rnd(rng) { return (rng || Math.random)(); }
  function shuffle(a, rng) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(rng) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // Opponent AI: builds a deck, then drafts each round with the same rules as the player.
  function genOpponentDeck(ownedIds, rng) {
    const owned = ownedIds.slice();
    const extra = ORDER.filter(id => !owned.includes(id) && UNITS[id].cost <= 5);
    const pool = owned.concat(shuffle(extra, rng).slice(0, owned.length > 8 ? 1 : 0));
    const deck = shuffle(pool, rng).slice(0, 5); // one copy of each card, like the player's deck
    return deck;
  }
  // Returns the unit ids the bot recruits this round (cards it saw and discarded are gone, same as for the player).
  function draftBot(deck, budget, rng) {
    let pool = drawPool(deck, budget, rng), got = [], discards = MAX_DISCARDS;
    while (budget > 0) {
      pool = pool.filter(id => UNITS[id].cost <= budget);
      if (!pool.length) break;
      const id = pool.shift(), c = UNITS[id].cost;
      // takes strong cards, gambles on cheap ones when there is room for a better pair
      const want = c >= 5 || budget - c <= 2 || rnd(rng) < 0.55;
      if (want || discards <= 0) { budget -= c; got.push(id); } else discards--;
    }
    return got;
  }

  let uidCounter = 1;
  function makeUnit(team, id, hp, maxHp) {
    const d = UNITS[id];
    const mh = maxHp || d.hp;
    return { uid: uidCounter++, team, id, def: d, hp: hp == null ? mh : hp, maxHp: mh, dmgMul: 1, x: 0, y: 0, cd: Math.random() * 0.5, alive: true, flash: 0, srcUid: null };
  }

  // players / enemies: [{uid,id,hp,maxHp}] (both sides persist between rounds)
  function createBattle(players, enemies) {
    const units = [];
    const place = (list, team) => {
      // front line first (melee), then ranged/bombers, artillery at the back; up to 8 ships per row
      const rank = u => { const r = u.def.role; return (r === 'Melee' || r === 'Elite' && u.def.range < 2) ? 0 : r === 'Artillery' ? 2 : 1; };
      const sorted = list.slice().sort((a, b) => rank(a) - rank(b) || a.def.cost - b.def.cost);
      const per = 8, rows = Math.ceil(sorted.length / per) || 1;
      const y0 = 9.3, y1 = 15.2, step = rows > 1 ? Math.min(1.5, (y1 - y0) / (rows - 1)) : 0;
      sorted.forEach((u, i) => {
        const row = Math.floor(i / per), inRow = Math.min(per, sorted.length - row * per);
        u.x = 1 + ((i % per) + 0.5) / inRow * 8;
        const y = y0 + row * step;
        u.y = team === 'p' ? y : H - y;
      });
    };
    const pu = players.map(p => { const u = makeUnit('p', p.id, p.hp, p.maxHp); u.srcUid = p.uid; return u; });
    const eu = enemies.map(e => { const u = makeUnit('e', e.id, e.hp, e.maxHp); u.srcUid = e.uid; return u; });
    place(pu, 'p'); place(eu, 'e');
    units.push(...pu, ...eu);
    return { units, events: [], proj: [], t: 0, winner: null };
  }

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    $('stR').style.opacity = Math.max(0, Math.min(1, dx / 90));
    $('stL').style.opacity = Math.max(0, Math.min(1, -dx / 90));
  };
  card.addEventListener('pointerdown', e => { if (busy) return; sx = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; card.classList.remove('enter'); });
  card.addEventListener('pointermove', e => { if (sx != null) set(e.clientX - sx); });
  const end = e => {
    if (sx == null) return;
    const dx = e.clientX - sx; sx = null;
    if (dx > 90) act(1); else if (dx < -90 && discards > 0) act(-1);
    else { card.style.transition = 'transform .2s'; set(0); }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}
$('btnRecruit').onclick = () => act(1);
$('btnDiscard').onclick = () => act(-1);
$('btnStart').onclick = () => { if (G.army.length) startBattle(); };
addEventListener('keydown', e => {
  if (!$('draft').classList.contains('on')) return;
  if (e.key === 'ArrowRight') act(1); else if (e.key === 'ArrowLeft') act(-1);
});

// ---------- VS screen ----------
function startBattle() {
  O.army.forEach(u => u.fresh = true);
  const row = (list, opp) => list.map(u => mc(u.id, u.hp / u.maxHp, { opp })).join('') || '<span class="empty">—</span>';
  const sum = l => l.reduce((s, u) => s + UNITS[u.id].cost, 0);
  modal(`<div class="vs"><h2>ROUND ${G.round}</h2>
    <div class="side"><div class="who"><span>${O.avatar} ${esc(O.name)}</span><span>${O.army.length} ships · ★${sum(O.army)}</span></div><div class="cards">${row(O.army, 1)}</div></div>
    <div class="mid">VS</div>
    <div class="side"><div class="who"><span>🧑‍✈️ ${esc(save.name)}</span><span>${G.army.length} ships · ★${sum(G.army)}</span></div><div class="cards">${row(G.army, 0)}</div></div>
    <button class="primary" id="mGo">⚔ START BATTLE</button></div>`);
  $('mGo').onclick = () => { closeModal(); runBattle(); };
}

// ---------- battle ----------
const cv = $('cv'), ctx = cv.getContext('2d');
const S = cv.width / W;
let B = null, speed = 1, raf = 0, last = 0, fx = [];
function runBattle() {
  show('battle');
  $('bWave').textContent = 'ROUND ' + G.round;
  B = SIM.createBattle(G.army, O.army);
  B.nP = G.army.length; B.nE = O.army.length;
  B.totalP = B.units.filter(u => u.team === 'p').reduce((s, u) => s + u.maxHp, 0);
  B.totalE = B.units.filter(u => u.team === 'e').reduce((s, u) => s + u.maxHp, 0);
  fx = []; last = performance.now(); B.endT = 0;
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
$('btnSpeed').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; $('btnSpeed').textContent = 'x' + speed; };
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  let t = dt * speed;
  while (t > 0 && !B.winner) { const d = Math.min(1 / 30, t); SIM.step(B, d); t -= d; }
  for (const e of B.events) { fx.push(e); if (e.k === 'boom' && (e.shot === 'shell' || e.shot === 'ball' || e.shot === 'comet')) B.shake = e.shot === 'shell' ? 7 : 3.5; } B.events.length = 0;
  B.shake = (B.shake || 0) * 0.88;
  for (const e of fx) { e.t += dt * speed; }
  fx = fx.filter(e => e.t < (e.dur || 0.45));
  draw(now / 1000);
  const hp = team => B.units.filter(u => u.team === team && u.alive).reduce((s, u) => s + u.hp, 0);
  $('hpP').style.width = (hp('p') / B.totalP * 100) + '%';
  $('hpE').style.width = (hp('e') / B.totalE * 100) + '%';
  if (B.winner) { B.endT += dt; if (B.endT > 0.9) return endBattle(); }
  raf = requestAnimationFrame(loop);
}
function draw(t) {
  const g = ctx, w = cv.width, h = cv.height;
  g.save(); if (B.shake > 0.3) g.translate((Math.random() - .5) * B.shake, (Math.random() - .5) * B.shake);
  const sea = g.createLinearGradient(0, 0, 0, h); sea.addColorStop(0, '#0f3d63'); sea.addColorStop(.5, '#1a6a9a'); sea.addColorStop(1, '#0f3d63');
  g.fillStyle = sea; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ffffff22'; g.lineWidth = 2;
  for (let y = 0; y < h; y += 28) { g.beginPath(); for (let x = 0; x <= w; x += 12) g.lineTo(x, y + Math.sin(x / 22 + t * 1.5 + y) * 3); g.stroke(); }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '800 12px system-ui,sans-serif'; g.fillStyle = '#ffffffaa';
  g.fillText(O.avatar + ' ' + O.name, w / 2, 12);
  g.fillText('🧑‍✈️ ' + save.name, w / 2, h - 12);
  const live = B.units.filter(u => u.alive);
  const sizeF = Math.max(0.85, 1.15 - Math.max(0, Math.max(B.nP, B.nE) - 6) * 0.025); // smaller ships in big fleets
  const list = B.units.slice().sort((a, b) => a.y - b.y);
  for (const u of list) {
    const x = u.x * S, y = u.y * S;
    // heading: face the nearest enemy; ships that moved leave a wake
    if (u.alive) {
      let tg = null, bd = 1e9;
      for (const o of live) if (o.team !== u.team) { const d = Math.hypot(o.x - u.x, o.y - u.y); if (d < bd) { bd = d; tg = o; } }
      const want = tg ? Math.atan2(tg.x - u.x, -(tg.y - u.y)) : (u.team === 'p' ? 0 : Math.PI);
      if (u.ang == null) u.ang = want;
      let df = want - u.ang; df = Math.atan2(Math.sin(df), Math.cos(df)); u.ang += df * 0.12;
      const moved = u.lx != null && Math.hypot(u.x - u.lx, u.y - u.ly) > 0.004;
      u.lx = u.x; u.ly = u.y;
      if (moved) {
        g.strokeStyle = '#ffffff40'; g.lineWidth = 2;
        for (const sd of [-1, 1]) { g.beginPath(); g.moveTo(x - Math.sin(u.ang) * 0 + sd * 6 * Math.cos(u.ang), y + sd * 6 * Math.sin(u.ang)); g.lineTo(x - Math.sin(u.ang) * 22 + sd * 9 * Math.cos(u.ang), y + Math.cos(u.ang) * 22 + sd * 9 * Math.sin(u.ang)); g.stroke(); }
      }
      if (u.flash > 0) { g.shadowColor = '#fff'; g.shadowBlur = 14; }
      drawShip(g, u.def, u.team, x, y, S * sizeF, u.ang);
      g.shadowColor = 'transparent'; g.shadowBlur = 0;
      const bw = 30, f = u.hp / u.maxHp;
      g.fillStyle = '#000a'; g.fillRect(x - bw / 2, y - S * 0.9, bw, 4);
      g.fillStyle = f > .5 ? '#3ddc84' : f > .25 ? '#ffc83d' : '#ff5a5f'; g.fillRect(x - bw / 2, y - S * 0.9, bw * f, 4);
      g.textAlign = 'center'; g.font = '800 8px system-ui,sans-serif'; g.fillStyle = '#ffc83d'; g.fillText(u.def.cost + '★', x, y - S * 0.9 - 5);
    } else {
      g.globalAlpha = 0.28; drawShip(g, u.def, u.team, x, y, S * sizeF, (u.ang || 0) + 0.5); g.globalAlpha = 1;
      g.font = '14px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.fillText('💀', x, y);
    }
  }
  // ---- projectiles in flight (each unit type has its own) ----
  const at = (p, f) => [p.sx + (p.tx - p.sx) * f, p.sy + (p.ty - p.sy) * f - Math.sin(Math.PI * f) * p.arc * 0.6];
  const dot = (x, y, r, c, a) => { g.globalAlpha = a; g.fillStyle = c; g.beginPath(); g.arc(x, y, Math.max(0.5, r), 0, 7); g.fill(); g.globalAlpha = 1; };
  for (const p of B.proj) {
    const f = p.f || 0, [mx, my] = at(p, f), x = mx * S, y = my * S;
    const dx = p.tx - p.sx, dy = p.ty - p.sy, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    if (p.arc > 0.5) { g.fillStyle = '#0003'; g.beginPath(); g.ellipse((p.sx + dx * f) * S, (p.sy + dy * f) * S, 4, 2, 0, 0, 7); g.fill(); }
    const tr = (n, step, col, r0, a0) => { for (let k = 1; k <= n; k++) { const [tx, ty] = at(p, Math.max(0, f - k * step)); dot(tx * S, ty * S, r0 * (1 - k / (n + 1)), col, a0 * (1 - k / (n + 1))); } };
    const line = (len, col, w) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); g.lineTo(x - ux * len, y - uy * len); g.stroke(); };
    switch (p.shot) {
      case 'arrow': line(10, '#f1e3b0', 1.6); dot(x, y, 1.6, '#fff', 1); break;
      case 'longarrow': line(16, '#ffffff', 2); line(4, '#9be28f', 3); dot(x, y, 2, '#fff', 1); break;
      case 'bullet': line(30, '#ffe27a', 2.2); dot(x, y, 3.5, '#fff6c8', 0.9); break;
      case 'bomb': dot(x, y, 4.5, '#1d1d22', 1); dot(x - 1, y - 1.5, 1.5, '#666', 1); dot(x + 2, y - 5, 1.8 + Math.sin(performance.now() / 40), '#ffb347', 1); tr(3, 0.04, '#999', 3, 0.4); break;
      case 'grenade': dot(x, y, 4, '#586b2c', 1); dot(x, y - 4, 1.6, '#c9ced6', 1); tr(5, 0.035, '#c6e86a', 3, 0.6); break;
      case 'comet': tr(8, 0.03, '#ff7a2a', 8, 0.7); dot(x, y, 9, '#ff9a3c', 0.35); dot(x, y, 5.5, '#ffd34d', 1); dot(x, y, 2.5, '#fff', 1); break;
      case 'ball': tr(6, 0.03, '#bbb', 4, 0.5); dot(x, y, 4.8, '#26262b', 1); dot(x - 1.4, y - 1.4, 1.6, '#8a8a94', 1); break;
      case 'shell': tr(10, 0.025, '#b48cff', 7, 0.5); dot(x, y, 9, '#a56bff', 0.3); dot(x, y, 6, '#2d1f4a', 1); dot(x - 1.5, y - 1.5, 2, '#d9c2ff', 1); break;
    }
  }
  // ---- muzzle flashes, melee swings, impacts and explosions ----
  for (const e of fx) {
    const p = Math.min(1, e.t / (e.dur || 0.45)), x = e.x * S, y = e.y * S, a = 1 - p;
    if (e.k === 'muzzle') {
      const dx = e.tx - e.x, dy = e.ty - e.y, L = Math.hypot(dx, dy) || 1, mx = x + dx / L * S * 0.6, my = y + dy / L * S * 0.6;
      const big = { cannon: 1, ball: 1, shell: 1.7, comet: 1.1, bullet: 0.9 }[e.shot] || 0;
      if (e.shot === 'ball' || e.shot === 'shell') { dot(mx, my, (8 + 10 * p) * big, '#ff9a3c', 0.8 * a); dot(mx + dx / L * 6 * p, my + dy / L * 6 * p, 6 + 14 * p, '#aaa', 0.5 * a); }
      else if (e.shot === 'bullet') { dot(mx, my, 8 * a, '#ffe27a', 0.9); }
      else if (e.shot === 'comet') { g.strokeStyle = `rgba(255,170,60,${a})`; g.lineWidth = 3; g.beginPath(); g.arc(mx, my, 4 + 10 * p, 0, 7); g.stroke(); }
      else if (e.shot === 'bomb' || e.shot === 'grenade') dot(mx, my, 3 + 5 * p, '#ddd', 0.5 * a);
      else if (e.shot === 'arrow' || e.shot === 'longarrow') dot(mx, my, 2 + 2 * p, '#fff', 0.6 * a);
    } else if (e.k === 'melee') {
      g.lineCap = 'round';
      if (e.shot === 'bash') { g.strokeStyle = `rgba(170,210,255,${a})`; g.lineWidth = 5 * a + 1; g.beginPath(); g.arc(x, y, 6 + 18 * p, 0, 7); g.stroke(); }
      else if (e.shot === 'saber') { g.strokeStyle = `rgba(255,211,77,${a})`; g.lineWidth = 4; g.beginPath(); g.arc(x, y, 14, 0.2 + p * 2.2, 1.6 + p * 2.2); g.stroke(); for (let k = 0; k < 5; k++) dot(x + Math.cos(k * 1.3) * 18 * p, y + Math.sin(k * 1.3) * 18 * p, 1.8, '#ffe9a0', a); }
      else if (e.shot === 'slash2') { g.strokeStyle = `rgba(255,120,110,${a})`; g.lineWidth = 3; for (const o of [0, 1.1]) { g.beginPath(); g.arc(x, y, 11, o + p * 1.5, o + 1.4 + p * 1.5); g.stroke(); } }
      else { g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 10, 0.4 + p, 2 + p); g.stroke(); }
    } else if (e.k === 'impact') {
      const col = { bullet: '#ffe27a', arrow: '#f1e3b0', longarrow: '#fff' }[e.shot] || '#fff';
      for (let k = 0; k < 5; k++) dot(x + Math.cos(k * 1.26) * 12 * p, y + Math.sin(k * 1.26) * 12 * p, 2, col, a);
    } else if (e.k === 'boom') {
      const R = e.r * S, pal = { bomb: ['255,150,40', '255,226,120'], grenade: ['170,210,60', '240,255,160'], comet: ['255,70,40', '255,230,120'], ball: ['255,160,60', '200,200,200'], shell: ['165,107,255', '255,200,120'] }[e.shot] || ['255,160,40', '255,230,120'];
      g.fillStyle = `rgba(${pal[0]},${0.55 * a})`; g.beginPath(); g.arc(x, y, R * (0.35 + 0.65 * p), 0, 7); g.fill();
      g.fillStyle = `rgba(${pal[1]},${0.9 * a * a})`; g.beginPath(); g.arc(x, y, R * 0.45 * (1 - p * 0.5), 0, 7); g.fill();
      g.strokeStyle = `rgba(${pal[1]},${a})`; g.lineWidth = 3; g.beginPath(); g.arc(x, y, R * (0.5 + 0.7 * p), 0, 7); g.stroke();
      if (e.shot === 'ball' || e.shot === 'shell') { g.strokeStyle = `rgba(255,255,255,${0.7 * a})`; g.lineWidth = 2; g.beginPath(); g.arc(x, y, R * (0.3 + 1.1 * p), 0, 7); g.stroke(); }
      const n = e.shot === 'shell' ? 12 : e.shot === 'grenade' ? 9 : 6;
      for (let k = 0; k < n; k++) { const an = k * 6.283 / n + 0.4, r = R * (0.4 + 0.9 * p); dot(x + Math.cos(an) * r, y + Math.sin(an) * r, 2.2 * a + 0.5, `rgb(${pal[1]})`, a); }
    }
  }
  g.restore();
}

// ---------- round / match end ----------
function modal(html) { $('modal').innerHTML = html; $('overlay').classList.add('on'); }
const closeModal = () => $('overlay').classList.remove('on');
function endBattle() {
  // Every ship you drafted comes back for the next round: survivors heal, fallen ships revive at half health.
  const carry = team => B.units.filter(u => u.team === team).map(u => ({ uid: u.srcUid, id: u.id, maxHp: u.maxHp,
    hp: u.alive ? Math.min(u.maxHp, Math.ceil(u.hp + u.maxHp * HEAL)) : Math.ceil(u.maxHp * REVIVE) }));
  const iWon = B.winner === 'p';
  const lostP = B.units.filter(u => u.team === 'p' && !u.alive).length, lostE = B.units.filter(u => u.team === 'e' && !u.alive).length;
  if (iWon) G.wins++; else G.losses++;
  G.army = carry('p'); O.army = carry('e');
  const done = G.wins >= WIN_ROUNDS || G.losses >= WIN_ROUNDS;
  const score = `${esc(save.name)} <b class="gold">${G.wins}</b> – <b class="gold">${G.losses}</b> ${esc(O.name)}`;
  if (!done) {
    const next = SIM.budgetFor(G.round + 1);
    modal(`<h2>${iWon ? '✅ Round won!' : '❌ Round lost'}</h2><p>${score}</p>
      <p>You lost ${lostP} ship${lostP === 1 ? '' : 's'}, ${esc(O.name)} lost ${lostE}.<br>Your whole fleet returns: survivors heal, fallen ships revive at ${REVIVE * 100}% health.</p>
      <p>Next round budget: <b class="gold">★${next}</b></p>
      <button class="primary" id="mOk">Next round →</button>`);
    $('mOk').onclick = () => { closeModal(); G.round++; startRound(); };
    return;
  }
  const win = G.wins > G.losses;
  const gold = (win ? 100 : 0) + 20 * G.wins, dT = win ? 25 : -15;
  const before = save.trophies; save.trophies = Math.max(0, save.trophies + dT); save.gold += gold; if (win) save.wins++; persist();
  modal(`<h2>${win ? '🏆 VICTORY!' : '💀 Defeat'}</h2><p>${score}</p>
    <p class="gold">${save.trophies - before >= 0 ? '+' : ''}${save.trophies - before} 🏆 · +🪙${gold}</p>
    <p>${win ? esc(O.name) + "'s fleet is sunk." : 'Rebuild your deck and try again.'}</p>
    <button class="primary" id="mOk">Back to port</button><button id="mAgain" style="margin-top:8px">⚔ New opponent</button>`);
  $('mOk').onclick = () => { closeModal(); renderHome(); };
  $('mAgain').onclick = () => { closeModal(); $('btnSail').click(); };
}

renderHome();
})();
</script>
